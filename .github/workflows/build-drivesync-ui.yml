name: Build DriveSync Portable

on:
  pull_request:
    branches: [main]
    paths:
      - 'design/drive-sync-portable/src/**'
      - '.github/workflows/build-drivesync-ui.yml'
  workflow_dispatch:
  push:
    branches: ['design/drive-sync-portable-ui']
    paths:
      - 'design/drive-sync-portable/src/**'
      - '.github/workflows/build-drivesync-ui.yml'

permissions:
  contents: read

jobs:
  portable-ui-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile Windows x64 self-contained portable EXE
        shell: pwsh
        run: |
          $proj = 'design/drive-sync-portable/src/DriveSyncPortable/DriveSyncPortable.csproj'
          dotnet publish $proj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -o output/app
          if ($LASTEXITCODE -ne 0) { throw 'DOTNET_PUBLISH_FAILED' }
          if (!(Test-Path output/app/DriveSyncPortable.exe)) { throw 'DRIVESYNC_EXE_NOT_FOUND' }
      - name: Run Windows executable UI smoke tests
        shell: pwsh
        run: |
          $exe = (Resolve-Path output/app/DriveSyncPortable.exe).Path
          $p = Start-Process -FilePath $exe -ArgumentList '--ui-smoke' -PassThru -Wait
          if ($p.ExitCode -ne 0) {
            $diag = Join-Path $env:TEMP 'drivesync-ui-smoke-error.txt'
            if (Test-Path $diag) { Get-Content $diag }
            throw "UI_SMOKE_FAILED_$($p.ExitCode)"
          }
      - name: Verify rounded card layout at 1664, 970 and 825 widths
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force output/layout | Out-Null
          $exe = (Resolve-Path output/app/DriveSyncPortable.exe).Path
          $p = Start-Process -FilePath $exe -ArgumentList '--layout-smoke output/layout' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "LAYOUT_SMOKE_FAILED_$($p.ExitCode)" }
      - name: Upload UI layout previews
        uses: actions/upload-artifact@v4
        with:
          name: DriveSyncPortable-v0.4.3-layout-audit
          path: output/layout/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Offline two-way sync integration smoke (no Google data)
        shell: pwsh
        run: |
          $exe = (Resolve-Path output/app/DriveSyncPortable.exe).Path
          $p = Start-Process -FilePath $exe -ArgumentList '--sync-smoke' -PassThru -Wait
          if ($p.ExitCode -ne 0) {
            $diag = Join-Path $env:TEMP 'drivesync-sync-smoke-error.txt'
            if (Test-Path $diag) { Get-Content $diag }
            throw "SYNC_SMOKE_FAILED_$($p.ExitCode)"
          }
      - name: Package EXE and SHA256
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force output/release | Out-Null
          Compress-Archive -Path 'output/app/*' -DestinationPath 'output/release/DriveSyncPortable-v0.4.3-win-x64.zip' -Force
          $hash = (Get-FileHash 'output/release/DriveSyncPortable-v0.4.3-win-x64.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  DriveSyncPortable-v0.4.3-win-x64.zip" | Set-Content -Path 'output/release/DriveSyncPortable-v0.4.3-win-x64.zip.sha256' -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: DriveSyncPortable-v0.4.3-win-x64
          path: output/release/*
          if-no-files-found: error
          retention-days: 30
