name: Build Windows EXE

on:
  push:
    branches: [main, feature/windows-auto-pack-v1]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Windows x64 portable
        shell: pwsh
        run: |
          $version = '1.0.0'
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $version = $env:GITHUB_REF_NAME.Substring(1) }
          dotnet restore ./SupraAutoPackLe.csproj
          if ($LASTEXITCODE -ne 0) { throw 'RESTORE_FAILED' }
          dotnet publish ./SupraAutoPackLe.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -p:Version=$version -o publish
          if ($LASTEXITCODE -ne 0) { throw 'PUBLISH_FAILED' }
          if (!(Test-Path publish/SupraAutoPackLe.exe)) { throw 'EXE_MISSING' }
      - name: Package and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force output | Out-Null
          Compress-Archive -Path 'publish/*' -DestinationPath 'output/SupraAutoPackLe-win-x64.zip' -Force
          $sha = (Get-FileHash 'output/SupraAutoPackLe-win-x64.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  SupraAutoPackLe-win-x64.zip" | Set-Content -Encoding ascii 'output/SupraAutoPackLe-win-x64.zip.sha256'
          Get-ChildItem output | Format-Table Name,Length
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SupraAutoPackLe-win-x64
          path: output/*
          if-no-files-found: error
          retention-days: 30

  publish-release:
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SupraAutoPackLe-win-x64
          path: output
      - name: Publish immutable release files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" output/SupraAutoPackLe-win-x64.zip output/SupraAutoPackLe-win-x64.zip.sha256 --repo "$GITHUB_REPOSITORY" --title "SUPRA Auto In Tem Pack Le $GITHUB_REF_NAME" --generate-notes
